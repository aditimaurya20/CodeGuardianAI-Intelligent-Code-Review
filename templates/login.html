{% load static %}

<!DOCTYPE html>
<html>

<head>

<title>Login - Code Reviewer AI</title>

<link rel="stylesheet"
href="{% static 'css/style.css' %}">

</head>


<body>


<nav class="navbar">


<div class="logo">
    Code Guardian AI
</div>


<div class="nav-links">

<a href="/">
Home
</a>


<a href="/register/">
Register
</a>


</div>


</nav>



<section class="hero">


<h1>
Login
</h1>

{% if error %}

<p style="color:red;">
    {{ error }}
</p>

{% endif %}

<form method="POST" class="auth-form">

    {% csrf_token %}

    <input
    type="text"
    name="username"
    placeholder="Enter Username"
    required>

    <input
    type="password"
    name="password"
    placeholder="Enter Password"
    required>

    <button class="btn">
        Login
    </button>

</form>



</section>



</body>

</html>
